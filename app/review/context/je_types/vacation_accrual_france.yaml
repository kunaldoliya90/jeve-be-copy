# France vacation accrual (CP + RTT). Owned by the business.
#
# This file says WHAT a review of this entry must establish, never WHERE anything sits in a
# particular workbook - that is the sheet map's job, and it is worked out per file. Adding
# another country or another leave scheme is a new file like this one, not new code, unless
# the arithmetic itself differs.
#
# Business context for everything below: the `vacation-accrual` skill.

id: vacation-accrual-france
version: 12
name: France vacation accrual
process: Record to Report
sub_process: Payroll
aliases:
  - CP/RTT accrual
  - conges payes accrual
  - GPAY accrual
  - vacation provision
  - leave accrual
objective: >
  Prove the vacation accrual is independently re-performable from employee-level leave and
  payroll data, correctly classified between FTE and non-FTE, and carried faithfully into
  the posted journal entry.

# --- how a workbook is recognised as this type, before any model call -------------------
discriminators:
  precedence: 10
  variants:
    # Tested first on purpose: a GPAY sheet also carries a daily-salary column and would
    # match the looser global variant, binding the wrong arithmetic and returning a number
    # that looks entirely plausible.
    - id: cp_rtt_france
      requires_all: [cp_provision, rtt_provision, daily_salary_rate]
      rejects: [adjusted_final_days]
    - id: ms_vacation_global
      requires_all: [adjusted_final_days, daily_salary]
      rejects: [cp_provision, rtt_provision]
  # At least one of these must be cited from outside the posting table. The posting tab's
  # own labels are the preparer's assertion; the calculation, methodology and master data
  # tabs are evidence.
  corroborating:
    - accounts_present
    - fte_classification_column
    - reversal_date_populated
  never:
    # One sample workbook holds its entire calculation on a tab called DENT.
    - tab_name_match

# --- the parameters the arithmetic needs ------------------------------------------------
methodology:
  # Never an assumed 30. The denominator comes from the approved methodology, and
  # methodology_drift diffs the workbook's own methodology tab against this.
  salary_per_day_denominator: approved
  eligible_leave_types: [CP, RTT]
  balance_floored_at_zero: true
  notes:
    - >
      965 rows in one sample workbook had taken more leave than earned to date. Without the
      floor those rows would reduce the provision.
    - >
      The workbooks add a twelfth of the RTT provision to a whole-year CP provision. It is
      reproduced because it is what was posted, and reported per affected row rather than
      silently accepted or silently corrected.

# --- the arithmetic that must hold on every record ---------------------------------------
# Read by step 13 through the `reperform` tool. Each identity is one line of arithmetic over
# the columns this type's working declares, and `against` names the column holding the
# workbook's own answer for the same quantity. These were Python until version 4, which
# meant the business could read its own arithmetic only by reading code; a country whose
# leave convention differs is now a YAML edit rather than a new tool.
#
# Note the difference from `recalculation:` below, which is deliberate. An identity is
# written over **column meanings** (`cp_earned`), because it is one line of arithmetic over
# columns a reviewer can point at and nothing about it is displayed per input. The entry
# formula is written over **declared inputs** (`fte_amount`) because each of those carries a
# unit and a source that the work paper shows beside every citation. Giving the identities
# the same machinery would mean ten more declarations whose units nobody reads.
#
# `tolerance` is per record and omitted where the business-wide tolerance applies. The
# valuation identity states a cent because a product is rounded to the currency's scale
# before it is stored, so a cent of difference there is the rounding and not an exception.
#
# `min_tie_rate` is the guard against a confident false finding: an identity that fails on
# nearly every row is the wrong convention for this workbook, not a workbook where every row
# is wrong. Both leave movements carry it because these files derive the balance from a
# carry-forward the columns do not show - 2,000 reported exceptions would all have been the
# harness's error, not the preparer's.
reperformance:
  table: calculation
  record_key: employee_ref
  identities:
    - id: fte_split_sums
      label: FTE plus non-FTE against the stated total
      expression: fte_accrual + non_fte_accrual
      against: total_accrual

    - id: rtt_valuation
      label: Balance in days times the daily rate
      expression: max(rtt_balance_days, 0) * daily_salary_rate
      against: rtt_accrual
      tolerance: 0.01

    - id: cp_movement
      label: CP earned minus taken against the stated balance
      expression: max(cp_earned - cp_taken, 0)
      against: cp_balance
      min_tie_rate: 0.5

    - id: rtt_movement
      label: RTT earned minus taken against the stated balance
      expression: max(rtt_earned - rtt_taken, 0)
      against: rtt_balance
      min_tie_rate: 0.5

    # The workbook's own stated total is itself reproducible from its two leg amounts: the
    # CP provision the payroll extract states, plus a twelfth of the RTT accrual (the same
    # convention `methodology.notes` describes). Verified against both sample French
    # workbooks before being declared: 2,271 of 2,271 rows on 305800.xlsx and 2,280 of 2,280
    # on 236264.xlsx tie to the cent. So a tampered CP provision or RTT accrual now surfaces
    # here rather than passing silently because nothing downstream re-read them.
    - id: cp_rtt_composition
      label: CP provision plus a twelfth of the RTT accrual against the stated total
      expression: cp_provision + (rtt_accrual / 12)
      against: total_accrual
      tolerance: 0.01

    # The CP provision is itself reproducible, one level further back: the payroll extract
    # types the prior and the current period's provision as two separate columns, and the
    # "Total Provision CP" the entry is built from is their sum. Either leg is blank in a
    # period it does not apply to - a new joiner has no N-1 leg, for instance - and the
    # business's own total simply omits it, which is what `coalesce` reproduces rather than
    # reading those rows as incomplete. Verified on both workbooks: every one of the 1,999 and
    # 1,961 rows where neither leg is blank ties exactly, and so does every one of the 274 and
    # 319 rows where one leg is.
    - id: cp_provision_builds_up
      label: Prior plus current period CP provision against the stated total
      expression: coalesce(cp_provision_prior, 0) + coalesce(cp_provision_current, 0)
      against: cp_provision
      tolerance: 0.01

    # --- the working's own internal arithmetic -------------------------------------------
    # The six identities above cover every column the posted figure is built from. These six
    # cover the rest of the row: the employer-charge columns, the two provision totals that
    # include those charges, the RTT provision the file states in money, and the prior
    # period's own leave balance. None of them reaches the posted amount - the entry excludes
    # employer social charges - so nothing here can change the figure a review reports. They
    # exist because an edit to a column nothing reads is still an edit to the working, and
    # until these were declared, "Provision Totale" could be moved by a million euros without
    # a single check noticing.
    #
    # `against_blank_is_zero` is on for all six, and it is the field's whole purpose. These
    # columns are left empty for an employee the provision does not apply to, rather than
    # written as a nought, and a skipped row is an uncovered row - so without it each of these
    # would report partial on a workbook with nothing wrong with it. Verified against both
    # French periods before being turned on: every blank coincides with a computed nil (the
    # CP provision is itself zero wherever its charge amount is blank, and the prior period's
    # earned and taken days are equal wherever its balance is), and with it on, all six tie on
    # every record of both files - 2,273 and 2,279 of each.
    #
    # The two charge amounts coalesce the *rate* as well. That is the one assumption here, and
    # it is bounded: it would hide a missing rate only on a row whose base provision is not
    # zero, and there is no such row on either workbook. Checked explicitly rather than
    # assumed, because reading a blank statutory rate as 0% is exactly the sort of confident
    # nought this harness otherwise refuses.
    - id: cp_charges_amount
      label: Employer charges on the CP provision at the stated rate
      expression: coalesce(cp_provision, 0) * coalesce(employer_charge_rate, 0) / 100
      against: employer_charge_amount
      against_blank_is_zero: true
      tolerance: 0.02

    - id: cp_provision_total_sums
      label: CP provision plus its employer charges against the stated total
      expression: coalesce(cp_provision, 0) + coalesce(employer_charge_amount, 0)
      against: cp_provision_with_charges
      against_blank_is_zero: true
      tolerance: 0.02

    - id: rtt_provision_values_the_balance
      label: RTT balance in days times the daily rate
      expression: coalesce(rtt_balance, 0) * daily_salary_rate
      against: rtt_provision_base
      against_blank_is_zero: true
      tolerance: 0.02

    - id: rtt_charges_amount
      label: Employer charges on the RTT provision at the stated rate
      expression: coalesce(rtt_provision_base, 0) * coalesce(employer_charge_rate, 0) / 100
      against: rtt_employer_charge_amount
      against_blank_is_zero: true
      tolerance: 0.02

    - id: rtt_provision_total_sums
      label: RTT provision plus its employer charges against the stated total
      expression: coalesce(rtt_provision_base, 0) + coalesce(rtt_employer_charge_amount, 0)
      against: rtt_provision
      against_blank_is_zero: true
      tolerance: 0.02

    - id: cp_prior_movement
      label: Prior period CP earned minus taken against the stated balance
      expression: coalesce(cp_earned_prior, 0) - coalesce(cp_taken_prior, 0)
      against: cp_balance_prior
      against_blank_is_zero: true
      tolerance: 0.02

# --- how the posted amount is regenerated from first principles --------------------------
# Read by step 13c. Deterministic code evaluates every line of this; no model sees any of it.
#
# The formula, from 2026-11-04 (v11): each employee's CP provision plus a twelfth of their
# RTT accrual - where the RTT accrual is now **rebuilt from the days and the rate** rather
# than read out of the column the workbook states it in. Summed over the population and set
# against the debit side of the posted entry, read from the posting tab's own lines: a
# different table on a different tab, so the two sides are independent and a difference
# between them means something.
#
# Why it changed from v9/v10, which read `rtt_accrual` directly. That formula took two stated
# columns and checked they added up to a third. Every input *behind* those two was examined
# too, but by separate checks with their own statuses, so an edited "Acquis RTT", "Pris RTT",
# "Months to Accrue" or "Daily Salary (RTT Rate)" left the headline figure reconciling to the
# cent and surfaced only further down the report. The business asked for the entry's own
# number to move when any column it is built from is wrong. It now reads five source columns
# instead of two, and the three intermediates are each compared against the workbook's own
# answer for the same quantity - so an edited stated column is still caught, as a
# corroboration that no longer agrees rather than as an unexplained total.
#
# The one convention that needed new machinery: an employee who has taken no RTT accrues none
# of it, which is not expressible with arithmetic alone. `recalc/formula.py` gained
# `if(condition, then, otherwise)` and six comparisons for it. The nearest arithmetic
# stand-in - scaling the leg by `min(days_taken, 1)` - was measured and rejected: it is
# correct only while nobody takes a half day, and three records across the two real workbooks
# do.
#
# Measured against the real files before being declared. Both French periods rebuild every
# record and reconcile within tolerance: 27,905,812.63 against 27,905,812.64 booked on
# 305800.xlsx, and 28,672,591.23 against 28,672,591.24 on 236264.xlsx - the latter a cent out
# where v10 was three cents out, because a product recomputed in Decimal carries precision the
# stated column had already rounded away. All four corroborating legs tie on every record of
# both: 2,273 and 2,280. The two employees on 305800.xlsx with an unmapped `#N/A` staffing
# type and no CP provision remain incomplete, which is the honest reading of a row whose
# inputs are absent, and 236264.xlsx now reconciles outright rather than partially.
#
# 935348.xlsb (the global MSVacation model) binds none of these columns - that convention is
# French-only - so its entry recalculation continues to report `unable_to_validate`, exactly
# as it has since v9. `RecalculationSpec` holds one formula for the whole JE type with no
# per-variant override; the business chose to accept this rather than build one.
#
# `provisional_basis` stays true until the business signs this formula and the tolerance off.
# The arithmetic runs either way; what changes is whether agreement may be relied on, and the
# work paper says so on its face.
#
# `tolerance_pct` is 0.01% (business instruction, 2026-11-09; it was 0.1% until 2026-11-04
# and 1% between those dates). It is headroom for a smaller entry of this type, not a
# response to the files seen so far: the dust each real file carries is cents against a
# multi-million-euro entry, and 0.01% of one of those is still a few thousand euro. Note
# what narrowing it does, now that `calculation_accuracy` scores by `entry_tolerance`: a
# difference outside it fails that area outright rather than merely being reported, so this
# number moves a compliance score on its own.
recalculation:
  table: calculation
  record_key: employee_ref
  stated: total_accrual
  formula: cp_provision + rtt_amount / 12
  sign: a positive amount is a debit to the expense accounts
  day_count: the approved denominator stated in the methodology, never an assumed 30
  tolerance_pct: 0.01
  row_tolerance: 0.01
  provisional_basis: true
  rounding: { decimals: 2, mode: half_up }
  currency: { meaning: currency, default: EUR }
  booked: { method: posting_debits, table: je_posting, amount: line_amount, account: account }
  worked_example: >
    One record of the working: a yearly RTT entitlement of 10 days, prorated over 8 months
    worked, gives 6.67 days earned; one day has been taken, leaving 5.67; valued at the
    employee's daily rate of EUR 311.73 that is an RTT accrual of 1,766.46, a twelfth of which
    is 147.21; added to the CP provision of 12,409.29 that gives 12,556.50, which is the
    amount the workbook states as that employee's total. The same record's FTE and non-FTE
    accruals, 12,556.50 and 0.00, also add to 12,556.50 - re-performed and compared separately
    below, since they corroborate the figure rather than build it. Every record's total added
    together gives the entry.
  # The short form of the formula: one line, one sentence per step, and the arithmetic each
  # step shows when a record is walked through it. `explained` below is the full prose
  # account and stays as it is - this is what the report leads with, because a reviewer
  # reading a difference wants the six lines before the six paragraphs.
  #
  # `shows` is a display template over `{name}` placeholders - an input, a derived term, or
  # an earlier step's id - and `expr` is what produces the number. They are deliberately
  # separate: `max(earned_rtt_days - rtt_days_taken, 0)` is the arithmetic, and "6.67 - 1"
  # is what a reader needs to see.
  walkthrough:
    stated_label: Employee total
    total: Total = Holiday amount (CP) + 1/12 of the value of unused RTT days
    footnote: Only for FTE and Non-FTE employees. Does not include employer charges.
    steps:
      - id: days_earned
        line: "Days earned = yearly RTT days ÷ 12 × months worked."
        label: Days earned
        shows: "{rtt_entitlement_days} ÷ 12 × {months_to_accrue}"
        expr: coalesce(rtt_entitlement_days, 0) / 12 * months_to_accrue
      - id: days_taken
        line: If the employee took no RTT days, the RTT amount is 0.
        label: Days taken
        shows: "{rtt_days_taken}"
        expr: coalesce(rtt_days_taken, 0)
      - id: days_left
        line: "Days left = days earned − days taken (not less than 0)."
        label: Days left
        shows: "{days_earned} − {days_taken}"
        expr: unused_rtt_days
      - id: value
        line: "Value = days left × daily salary."
        label: Value
        shows: "{days_left} × {daily_rate}"
        expr: unused_rtt_days * daily_rate
      - id: month_share
        line: Divide the value by 12.
        label: Divide by 12
        shows: "{value} ÷ 12"
        expr: unused_rtt_days * daily_rate / 12
      - id: total
        line: Add the holiday amount (CP).
        label: Add holiday amount
        shows: "{month_share} + {cp_provision}"
        expr: cp_provision + rtt_amount / 12

  # The same record as `worked_example` above, in plain language for a reader who has never
  # seen this formula. Fixed numbers, chosen once and checked against the identities above
  # rather than read live from any particular review - the same convention `worked_example`
  # already follows, so a new review never changes what this section says.
  explained:
    intro: >
      The formula used, explained step by step.
    context: >
      What we are calculating: how much the company owes an employee for paid leave they have
      earned but not yet taken. There are two kinds of leave. Regular paid holidays (CP), and
      RTT days, which are extra days off for working beyond 35 hours a week.
    steps:
      - label: How many RTT days has the employee earned so far this year?
        detail: >
          An employee earns their yearly RTT days gradually, month by month. We take the full
          year's allowance, divide it by 12 to get one month's worth, and multiply by the
          number of months worked so far.
        example: "10 days a year / 12 x 8 months = 6.67 days earned so far"
      - label: Has the employee used any of those days?
        detail: >
          If no RTT days have been taken at all, the RTT part of the accrual is nil and the
          calculation goes straight to the paid-holiday amount. Otherwise it carries on.
        example: Say 1 day has been taken, so the calculation continues.
      - label: How many of those days are still unused?
        detail: >
          Subtract the RTT days the employee has already taken. If they have taken more than
          they have earned, count it as zero, never negative.
        example: "6.67 earned - 1 taken = 5.67 days left"
      - label: What are the unused days worth?
        detail: Multiply the days left by the employee's daily salary.
        example: "5.67 days x EUR 311.73 = EUR 1,766.46"
      - label: Take one month's share.
        detail: >
          Divide that amount by 12 to get the portion that belongs to the current month.
        example: "EUR 1,766.46 / 12 = EUR 147.21"
      - label: Add the paid-holiday (CP) amount.
        detail: >
          Add the amount already set aside for the employee's unused regular paid holidays,
          from last year and this year combined.
        example: "EUR 147.21 + EUR 12,409.29 = EUR 12,556.50"
      - label: Check the employee type.
        detail: >
          The calculation only applies to employees classified as FTE or Non-FTE. For anyone
          else the result is zero.
        example: Say the employee is FTE, so the result stands.
    summary: >
      In one sentence: the total accrual is one month's share of the value of unused RTT days,
      plus the full value of unused paid holidays, for FTE and Non-FTE employees only.
    caveats:
      - The amount excludes employer social charges.
      - Only the RTT portion is divided by twelve; the paid-holiday amount is counted in full.
      - >-
        Both legs are floored at zero, so a balance that has been overspent never turns an
        employee's accrual negative.
      - >-
        Step 2 sets the RTT part to zero whenever an employee has taken no RTT days at all. On
        both sample workbooks the file's own balance column is nil on every one of those
        records, so this reproduces the preparer's own convention rather than imposing one.
        Confirm it with whoever owns the formula before relying on this explanation.
      - >-
        Step 7 describes the population this entry is meant to cover, and no check currently
        enforces it: nothing yet verifies that an employee outside the FTE and Non-FTE classes
        carries a zero.
  # Every column the formula is built from is declared here, so the work paper can show each
  # one beside its value and its cell on any record it cites. `required: false` where a blank
  # is the business's own answer rather than a gap - see each description.
  inputs:
    - id: cp_provision
      meaning: cp_provision
      unit: currency
      required: true
      description: >
        The CP provision as the payroll extract states it for the employee: last year's
        provision plus this year's. Rebuilt from those two legs in its own right by
        `cp_provision_rebuilds`.
    - id: rtt_entitlement_days
      meaning: rtt_earned
      unit: days
      required: false
      description: >
        The employee's RTT entitlement for the full year, before proration. Blank for an
        employee with no RTT entitlement in the period - 137 and 132 records on the two real
        workbooks, all of them ordinary employees with real CP activity - so it is folded to
        zero rather than read as a gap.
    - id: months_to_accrue
      meaning: months_to_accrue
      unit: months
      required: true
      description: Months of the vacation year worked at the reporting date.
    - id: rtt_days_taken
      meaning: rtt_taken
      unit: days
      required: false
      description: >
        RTT days already taken. Blank on about a quarter of the records, and there it means
        none have been taken rather than that the figure is unknown.
    - id: daily_rate
      meaning: daily_salary_rate
      unit: currency_per_day
      required: true
      description: The daily salary rate the RTT days are valued at.
    - id: fte_amount
      meaning: fte_accrual
      unit: currency
      required: false
      description: >
        The employee's FTE share of the accrual. Carried for the corroborating split below,
        not for the main formula.
    - id: non_fte_amount
      meaning: non_fte_accrual
      unit: currency
      required: false
      description: The non-FTE share, carried for the same corroboration.
  # The formula in stages. Each `agrees_with` names the column the workbook states its own
  # answer for that quantity in, so every intermediate is compared against the file as well as
  # feeding the next step - which is what keeps an edit to a stated column visible even though
  # the formula no longer reads it.
  derive:
    - id: earned_rtt_days
      expression: coalesce(rtt_entitlement_days, 0) / 12 * months_to_accrue
      label: RTT days earned
      unit: days
      agrees_with: rtt_earned_days
      description: >
        The yearly RTT entitlement prorated over the months worked. Compared against the
        workbook's own earned-days column, which nothing read at all before this.
    - id: unused_rtt_days
      expression: if(coalesce(rtt_days_taken, 0) == 0, 0, max(earned_rtt_days - rtt_days_taken, 0))
      label: Unused RTT days
      unit: days
      agrees_with: rtt_balance_days
      description: >
        Days earned so far less days taken, floored at zero - and nil outright for an employee
        who has taken none, which is the convention the file itself applies.
    - id: rtt_amount
      expression: unused_rtt_days * daily_rate
      label: Rebuilt RTT accrual
      unit: currency
      agrees_with: rtt_accrual
      description: >
        The RTT accrual, rebuilt from the days and the rate. A twelfth of this is what the
        formula adds to the CP provision.
    - id: fte_split
      expression: fte_amount + non_fte_amount
      label: FTE plus non-FTE accrual
      unit: currency
      agrees_with: total_accrual
      description: >
        FTE plus non-FTE accrual, re-performed and compared with the stated total - the formula
        this card used up to version 8; corroborating rather than deciding ever since.

accounts:
  source: master_data
  fte_expense: "720008"
  non_fte_expense: "720023"
  liability: "322000"

population:
  include_fte: [regular, expat, commission_eligible, retail, direct_production]
  include_non_fte: [co_op, intern, visiting_researcher]
  exclude: [agency_temp, vendor, contractor, fixed_term]

# --- what must be found, and what it must hold ------------------------------------------
tables:
  calculation:
    required: true
    # What this type's checks actually read. The leave columns were missing until version 4,
    # when declaring the arithmetic here made the omission visible: the tools read them, the
    # file never asked for them, so step 12 could not have told anybody they were absent.
    meanings:
      [employee_ref, company_code, cost_center, staffing_type, fte_classification,
       cp_earned, cp_taken, cp_balance, cp_earned_prior, cp_taken_prior, cp_balance_prior,
       cp_provision, cp_provision_prior, cp_provision_current, cp_provision_with_charges,
       employer_charge_rate, employer_charge_amount,
       rtt_earned, rtt_earned_days, rtt_taken, rtt_balance, rtt_balance_days, rtt_accrual,
       rtt_provision_base, rtt_employer_charge_amount, rtt_provision,
       months_to_accrue, daily_salary_rate, currency, fte_accrual,
       non_fte_accrual, total_accrual]
  employee_master:
    required: true
    meanings: [employee_ref, sap_company, cost_center, staffing_type, start_date, active]
  aggregation:
    required: true
    meanings: [company_code, currency, cost_center, fte_accrual, non_fte_accrual]
  je_staging:
    required: false
    meanings: [company_code, account, currency, cost_center, line_amount]
  je_posting:
    required: true
    meanings:
      [header_id, company_code, account, currency, cost_center, line_amount, posting_date,
       reversal_date, fiscal_year, fiscal_period]
  entity_master:
    required: false
    meanings: [company_code, company_name, currency, liability_account]
  self_check:
    required: false

facts: [fiscal_period, hash_total, je_total, preparer, approver, posting_date, reversal_date]

# `expected` is what a reviewer is looking for, in the business's own words. It is read by
# a person on the evidence register and never matched against anything: matching is the
# sheet map's job, and a register that only says "missing" tells nobody where to look.
evidence:
  - id: methodology
    required: true
    kind: sheet
    expected: Documented leave-accrual methodology and assumptions.
    remediation: Attach the methodology tab stating the calculation basis and denominator.
  - id: accrual_calculation
    required: true
    kind: sheet
    expected: Leave balances and daily-rate working paper.
    remediation: Attach the employee-level working that the accrual is calculated on.
  - id: employee_master
    required: true
    kind: sheet
    expected: Employee population, status, and FTE data.
    remediation: Attach the employee master extract covering the reporting date.
  - id: approval
    required: true
    kind: sheet_or_fact
    expected: Approval for the leave accrual.
    remediation: Record the approver and the approval date on the entry.
  - id: vacation_provision_file
    required: false
    kind: sheet
    expected: Vacation provision file supporting this journal entry.
  - id: provider_screenshot
    required: false
    kind: picture
    expected: Provider or payroll screenshot evidencing the posted amount.
    corroborate: [je_total, hash_total]

# --- what the review is scored on -------------------------------------------------------
# Version 7 moved this type onto the six-parameter model every entry type now reports under,
# weighted 30/10/30/10/10/10. This is a business decision superseding the eight-area weights
# confirmed on 2026-10-20 (version 6, still readable in this file's history), and it needs
# its own business sign-off before being relied on in anger - the same caveat the entry
# recalculation's own tolerance already carries as `provisional_basis`.
#
# What moved where:
#   calculation_accuracy combines the old accrual_reperformance and je_reconciliation (the
#     number itself, and whether the right number got posted) with the four employee-level
#     checks that used to be scored separately by exception rate and impact share:
#     population, classification, salary_validation and leave_validation.
#
#     It scored by weakest check until 2026-11-09, which read a handful of bad employee
#     rows out of thousands as 0/100 for the whole calculation even on an entry that
#     rebuilt to the posted amount inside tolerance. It now scores by `entry_tolerance`:
#     the work paper's own entry-level answer, over every record it could read, under the
#     tolerance stated below - 100 where the entry ties, and the weakest check wherever
#     the work paper cannot answer at all. Deliberately accepted, and business-asked: a
#     failed check inside the area no longer decides the score on its own. It is still on
#     the card, still in the check list, and still waiting for whoever it is assigned to.
#   pii is no longer an observation. Employee data on the calculation tab and the employee
#     master is still expected and still not a finding; only a leak onto the SAP-facing
#     posting tab fails this area, so it is expected to read 100 on almost every review.
#   trend is new: business_rules.yaml now states a (placeholder) deviation threshold, so the
#     check that used to always report "no threshold configured" can now fail. It still
#     passes wherever this entry type has no prior review to compare against.
#   evidence_appropriateness is new: it turns step 9's own corroboration of the recognised
#     entry type - already surfaced as `je_type_corroborated` - into a scored parameter
#     instead of a fact nothing but the UI's header strip read. AI-E itself is disabled for
#     now (2026-11-04): a live run flagged a cost-centre mismatch the business has not yet
#     reviewed, so `evidence_matches_je_type` always reports `missing_evidence` (zero credit,
#     needs a person) rather than calling the model - see
#     `review.orchestrator.orchestrator._gate_on_evidence`.
areas:
  evidence_completeness: { weight: 30, method: baseline_share }
  evidence_appropriateness: { weight: 10, method: weakest_check }
  calculation_accuracy: { weight: 30, method: entry_tolerance }
  period: { weight: 10, method: weakest_check }
  pii: { weight: 10, method: weakest_check }
  trend: { weight: 10, method: weakest_check }

checks:
  # Whether a required layer is present is something code can establish outright - a sheet
  # either satisfies a role or it does not - so this is decided by the figure, never by a
  # model's reading of the same register. Coverage is over the required layers only: one of
  # four present is partial, by RowCoverage, the same way a part-tied recalculation is
  # partial rather than failed outright; none of them present is the one case that fails.
  - id: evidence_baseline
    area: evidence_completeness
    question: Are the required evidence items present?
    decided_by: figures
    risk: The entry is unsupported and nobody can re-perform it later.
    recipe: { tool: evidence_register, args: {} }

  - id: population_complete
    area: calculation_accuracy
    question: >
      Is every employee in the working present in the employee master, with no duplicates,
      no unexpected additions and nobody inactive at the reporting date?
    decided_by: figures
    risk: Employees missing, duplicated or ineligible over- or understate the accrual.
    recipe: { tool: population_reconcile, args: { table: calculation, master: employee_master } }

  # The tool compares each row's classification against the side its amount sits on, which
  # is what the workbook itself can prove. Comparing the classification against the employee
  # master needs a joinable employee reference, and in these files it is redacted; the
  # population check carries that gap.
  - id: classification_matches_master
    area: calculation_accuracy
    question: >
      Does each employee's amount sit on the side their FTE or non-FTE classification says
      it should?
    decided_by: figures
    risk: A misclassified employee posts a correct amount to the wrong expense account.
    recipe: { tool: classification_check, args: { table: calculation } }

  - id: salary_agrees_with_source
    area: calculation_accuracy
    question: Does the salary used agree with the source, and is it effective at the date?
    decided_by: figures
    risk: An outdated or mismapped salary misstates every day of accrued leave.
    recipe: { tool: salary_validate, args: { table: calculation, master: employee_master } }

  - id: salary_per_day_follows_methodology
    short: RTT days value
    area: calculation_accuracy
    question: >
      Does the leave balance times the daily rate give the accrual the workbook states,
      employee by employee?
    decided_by: figures
    risk: An amount that cannot be rebuilt from its own inputs has no basis.
    recipe: { tool: reperform, args: { table: calculation, identities: [rtt_valuation] } }

  - id: leave_balance_recalculates
    short: Leave balance
    area: calculation_accuracy
    question: Does opening + earned - taken +/- adjustments equal the closing balance?
    decided_by: figures
    risk: The leave balance is the quantity being valued; an error here scales linearly.
    recipe:
      { tool: reperform,
        args: { table: calculation, identities: [cp_movement, rtt_movement] } }

  # Not declared as a `reperform` identity: the rule it reproduces is not one line of
  # arithmetic. Verified on both sample workbooks that a blank "Pris RTT" does not carry the
  # full earned-to-date balance forward - the file's own stated balance is zero on every one
  # of 547 and 527 such rows, never the earned amount a plain `max(earned - 0, 0)` would give.
  # An identity that read the gap as missing would be wrong twice over: it would count a
  # confident zero as unbound, and the balance this check establishes feeds the valuation
  # check above through `rtt_accrual`, so a permanently-partial coverage here would be a
  # landmine on every clean file of this type.
  - id: rtt_balance_rebuilds
    short: RTT balance
    area: calculation_accuracy
    question: >
      Does the RTT balance used for valuation reproduce from the days earned to date and the
      days taken, employee by employee?
    decided_by: figures
    risk: >
      The valuation check above trusts this balance as given; an error here reaches the
      posted amount through a column nothing upstream of it re-reads.
    recipe: { tool: rtt_balance_reperforms, args: { table: calculation } }

  # The entry-level re-performance, and the only check that sets the posted amount against a
  # figure rebuilt from the inputs rather than against another column of the same workbook.
  # It overlaps `fte_split_aggregates` by design: that check asks whether each row's split
  # sums to its own total, this one asks whether the entry can be produced again at all and
  # whether what was produced is what was booked. The first can hold while the second fails,
  # which is precisely the case nothing else here would catch.
  - id: entry_total_recalculates
    short: Employee total
    area: calculation_accuracy
    question: >
      Can the amount that was posted be regenerated from the approved formula, record by
      record, and does the total agree with what was booked, within tolerance?
    decided_by: figures
    risk: >
      An entry that cannot be reproduced from its own inputs has no basis a reviewer can
      stand behind, and a difference against the posted amount is money in the wrong period
      or the wrong account.
    recipe: { tool: recalc_entry_total, args: { table: calculation } }

  - id: accrual_reperforms
    area: calculation_accuracy
    question: >
      Does an independent recalculation of eligible leave times salary per day agree with
      the working, row by row?
    decided_by: figures
    risk: >
      The whole purpose of the review. A total that agrees while rows cancel out is a
      coincidence; row-level agreement is the evidence.
    recipe: { tool: reperform, args: { table: calculation, identities: [fte_split_sums] } }

  - id: negative_accruals_explained
    area: calculation_accuracy
    question: Are any negative employee-level accruals expected rather than bad data?
    decided_by: figures
    risk: A negative accrual is either a genuine adjustment or a mapping error.
    recipe: { tool: negative_scan, args: { table: calculation, column: total_accrual } }

  # Catches what `accrual_reperforms` cannot: that check only asks whether the split sums
  # to the total the workbook already states, so a CP provision or RTT accrual edited
  # without touching the total or the split would still tie. This check rebuilds the total
  # from the two components an employee's accrual is actually made of.
  - id: accrual_composition_reperforms
    short: Accrual composition
    area: calculation_accuracy
    question: >
      Does the stated total equal the CP provision plus a twelfth of the RTT accrual,
      employee by employee?
    decided_by: figures
    risk: >
      An employee's total that does not tie to its own CP and RTT components carries an
      unexplained adjustment, or one of those components was changed after the total was
      struck.
    recipe: { tool: reperform, args: { table: calculation, identities: [cp_rtt_composition] } }

  # Catches what `accrual_composition_reperforms` cannot: that check takes the CP provision
  # itself as given, so an edit to the prior- or current-period leg that nobody re-struck the
  # total from would still tie there. This rebuilds the CP provision from the two columns the
  # payroll extract actually types.
  - id: cp_provision_rebuilds
    short: CP provision
    area: calculation_accuracy
    question: >
      Does the stated CP provision equal the prior plus the current period's provision,
      employee by employee?
    decided_by: figures
    risk: >
      A CP provision that does not tie to its own two periods carries an unexplained
      adjustment, or one of those periods was changed after the total was struck.
    recipe:
      { tool: reperform, args: { table: calculation, identities: [cp_provision_builds_up] } }

  # --- the working's own internal arithmetic ----------------------------------------------
  # One check per identity rather than one check carrying all six, which matters for the
  # status a tamper reaches: `outcome_for` takes a figures-decided status from the *decisive*
  # figure, and a reperform figure is not decisive, so the first one in the list stands in.
  # Grouped, a discrepancy in the second or third identity would surface only as incomplete
  # coverage - partial, not failed - and a million euros moved in a provision total deserves
  # the stronger word. Each of these is also a different assertion a reviewer would want to
  # read as its own line.
  #
  # None of these columns reaches the posted amount, since the entry excludes employer social
  # charges. They are checked because an edit to a column nothing reads is still an edit to
  # the working, and that is what an undetected manipulation looks like.
  - id: cp_charges_tie_to_the_rate
    area: calculation_accuracy
    question: >
      Do the employer charges on each employee's CP provision equal that provision at the
      rate the workbook states for them?
    decided_by: figures
    risk: >
      A charge amount that does not follow its own stated rate has been typed over, or the
      rate was changed after the amount was struck.
    recipe: { tool: reperform, args: { table: calculation, identities: [cp_charges_amount] } }

  - id: cp_provision_total_includes_its_charges
    area: calculation_accuracy
    question: >
      Does the stated total CP provision equal the provision plus its employer charges,
      employee by employee?
    decided_by: figures
    risk: >
      The column the preparer reads as the full cost of the CP liability no longer agrees
      with the two figures it is made of.
    recipe:
      { tool: reperform, args: { table: calculation, identities: [cp_provision_total_sums] } }

  - id: rtt_provision_values_the_balance
    short: RTT provision
    area: calculation_accuracy
    question: >
      Does the RTT provision the workbook states in money equal the RTT balance in days at
      the employee's daily rate?
    decided_by: figures
    risk: >
      The RTT liability was valued at a rate or a balance other than the ones the workbook
      carries for that employee.
    recipe:
      { tool: reperform,
        args: { table: calculation, identities: [rtt_provision_values_the_balance] } }

  - id: rtt_charges_tie_to_the_rate
    area: calculation_accuracy
    question: >
      Do the employer charges on each employee's RTT provision equal that provision at the
      rate the workbook states for them?
    decided_by: figures
    risk: >
      As for the CP charges: an amount that does not follow its own stated rate has been
      typed over.
    recipe: { tool: reperform, args: { table: calculation, identities: [rtt_charges_amount] } }

  - id: rtt_provision_total_includes_its_charges
    area: calculation_accuracy
    question: >
      Does the stated total RTT provision equal the provision plus its employer charges,
      employee by employee?
    decided_by: figures
    risk: >
      The column the preparer reads as the full cost of the RTT liability no longer agrees
      with the two figures it is made of.
    recipe:
      { tool: reperform, args: { table: calculation, identities: [rtt_provision_total_sums] } }

  - id: prior_period_cp_balance_ties
    area: calculation_accuracy
    question: >
      Does the prior period's CP balance equal that period's earned days less the days taken,
      employee by employee?
    decided_by: figures
    risk: >
      The brought-forward leave balance the current period's provision is built on top of
      does not tie to its own movement.
    recipe: { tool: reperform, args: { table: calculation, identities: [cp_prior_movement] } }

  - id: fte_split_aggregates
    area: calculation_accuracy
    question: Does FTE accrual plus non-FTE accrual equal the stated total, per employee?
    decided_by: figures
    risk: A split that does not sum hides an employee counted twice or not at all.
    recipe: { tool: reperform, args: { table: calculation, identities: [fte_split_sums] } }

  - id: working_ties_to_posting
    area: calculation_accuracy
    question: Does the employee-level calculation tie to the posted entry, by company code?
    decided_by: figures
    risk: Amounts lost between the working and the entry still leave a grand total agreeing.
    # The aggregation tab is deliberately not a hop in this chain. It is an Excel pivot
    # whose rows include its own subtotals, so summing them counts the same money several
    # times over - on one sample file, exactly three times. A hop that cannot be summed
    # without double counting would report a difference that is not there, which is a worse
    # outcome than not checking it: see the open items in docs/context.md.
    recipe: { tool: rollup_chain, args: { hops: [calculation, je_posting] } }

  - id: accounts_mapped_correctly
    area: calculation_accuracy
    question: Are FTE, non-FTE and liability amounts posted to the accounts the master states?
    decided_by: figures
    risk: The right total in the wrong account misstates the expense split.
    recipe: { tool: account_mapping, args: { table: je_posting, master: entity_master } }

  - id: entry_balances
    area: calculation_accuracy
    question: Do total debits equal total credits, overall and per company code and currency?
    decided_by: figures
    risk: An unbalanced entry will not post, or will post against a suspense account.
    recipe: { tool: balance, args: { table: je_posting, group_by: [company_code, currency] } }

  - id: stated_totals_agree
    area: calculation_accuracy
    question: Do the hash total and JE total stated on the entry equal the sum of the lines?
    decided_by: figures
    risk: The preparer's own control total is stale or hardcoded.
    recipe: { tool: control_totals, args: { table: je_posting, facts: [hash_total, je_total] } }

  - id: posting_period_agrees
    area: period
    question: Do the fiscal period on the entry, in the header and on the lines all agree?
    decided_by: judgement
    risk: Leave, salary or status data from the wrong period misstates the obligation.
    recipe: { tool: period_agreement, args: { table: je_posting } }

  - id: reversal_is_configured
    area: period
    question: >
      Is the reversal date later than the posting date, using the same accounts with
      opposite signs, and not duplicated into another period?
    decided_by: figures
    risk: A missing or duplicated reversal double-counts the liability.
    recipe: { tool: reversal_check, args: { table: je_posting } }

  # Reported to the reviewer, never scored.
  - id: methodology_unchanged
    area: observation
    question: Does the methodology tab state the same period the entry posts in?
    decided_by: figures
    risk: >
      A workbook rolled forward without being re-based passes every arithmetic check,
      because each figure agrees with the others under the wrong basis.
    recipe: { tool: methodology_drift, args: { table: je_posting } }

  - id: manual_updates_supported
    area: observation
    question: Are numbers typed over formulas explained?
    decided_by: judgement
    risk: >
      One sample file holds 137 hardcoded zeros in a calculated column, which drops a leg of
      the provision for those employees.
    recipe: { tool: formula_health, args: {} }

  - id: personal_data_located
    area: pii
    question: Where does personal data appear, and is it expected on that tab?
    decided_by: figures
    risk: >
      Employee data is expected on the working and the master; on the SAP-facing posting tab
      it is a leak.
    recipe:
      { tool: pii_scan, args: { expected_on: [calculation, employee_master],
                                forbidden_on: [je_posting] } }

  # Run as its own gated step before anything else, not through the ordinary fan-out: see
  # `review.orchestrator.orchestrator._gate_on_evidence`. The question it settles is content,
  # not shape - whether the identity in the calculation sheet, the employee master and any
  # pasted screenshot agrees with the entity actually posted, never whether the right
  # category of evidence is present (that is `evidence_completeness`, a different question).
  - id: evidence_matches_je_type
    area: evidence_appropriateness
    question: >
      Does the supporting evidence - the calculation sheet, the employee master, any pasted
      screenshot - relate to the same entity and transaction as the entry actually posted?
    decided_by: figures
    risk: >
      Evidence for the wrong entity can satisfy every other check perfectly and still be
      evidence for somebody else's accrual; a reviewer who signs off a correctly-calculated
      wrong entity has approved nothing.
    recipe: { tool: evidence_appropriateness, args: {} }

  # `max_change_pct` is a placeholder (business_rules.yaml) pending sign-off, and the check
  # passes on every review of an entry type with no prior period to compare against, so this
  # reads as a pass on nearly every review until both the threshold and a few periods of
  # history exist.
  - id: trend_within_tolerance
    area: trend
    question: >
      Does the posted amount fall within the agreed deviation of the trailing three-month
      average for this entry type?
    decided_by: figures
    risk: >
      A liability that jumps between periods with no corresponding change in the population
      or the rate is the cheapest sign of a basis that silently changed.
    recipe: { tool: trend_check, args: {} }

known_patterns:
  - The calculation tab links its provision columns to a payroll extract on another tab.
  - A preamble of batch options sits above the real line header on the posting tab.
  - Employee name columns arrive redacted to "Confidential".
